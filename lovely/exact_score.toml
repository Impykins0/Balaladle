[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.chips - G.GAME.blind.chips >= 0 then"
position = "at"
payload = '''
if (G.GAME.modifiers.impy_exact_score and G.GAME.chips == G.GAME.blind.chips) or 
    (not G.GAME.modifiers.impy_exact_score and G.GAME.chips - G.GAME.blind.chips >= 0) 
then
'''
match_indent = true