[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = localize('ph_blind_score_at_least'), scale = 0.3, colour = G.C.WHITE, shadow = true}}"
position = "at"
payload = '''
{n=G.UIT.T, config={
        text = G.GAME.modifiers.impy_close_to_target
            and localize('ph_impy_close_to_target')
            or localize('ph_blind_score_at_least'), 
        scale = 0.3, 
        colour = G.C.WHITE, 
        shadow = true
    }
}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = localize('ph_blind_score_at_least'), scale = 0.3, colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE, shadow = not disabled}}"
position = "at"
payload = '''
{n=G.UIT.T, config={
        text = G.GAME.modifiers.impy_close_to_target
            and localize('ph_impy_close_to_target')
            or localize('ph_blind_score_at_least'),
        scale = 0.3, 
        colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.WHITE, 
        shadow = not disabled
    }
}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = localize('ph_blind_score_at_least'), scale = 0.35, colour = G.C.UI.TEXT_DARK}}"
position = "at"
payload = '''
{n=G.UIT.T, config={
        text = G.GAME.modifiers.impy_close_to_target
            and localize('ph_impy_close_to_target')
            or localize('ph_blind_score_at_least'), 
        scale = 0.35, 
        colour = G.C.UI.TEXT_DARK
    }
},
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{n=G.UIT.T, config={text = number_format(blind_amt), scale = score_number_scale(0.9, blind_amt), colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow =  not disabled}}"
position = "at"
payload = '''
{n=G.UIT.T, config={
        text = G.GAME.modifiers.impy_calculated_score and "???" 
            or number_format(blind_amt),
        scale = G.GAME.modifiers.impy_calculated_score and 0.7 
            or score_number_scale(0.9, blind_amt),
        colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED,
        shadow = not disabled
    }
}
'''
match_indent = true

[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = '''(?<indent>[\t ]*)\{n=G\.UIT\.C, config=\{align = "cm", padding = 0\.1\}, nodes=\{t\.nodes\[1\]\}\r?\n[\t ]*\}'''
position = "at"
payload = '''
{n=G.UIT.C, config={align = "cm", padding = 0.1}, nodes={t.nodes[1]}},
{n=G.UIT.C, config={align = "cm", padding = 0.1}, nodes={
        G.GAME.modifiers.impy_leaderboard
            and BALALADLE.UI.create_UIBox_balaladle_leaderboard()
            or nil,
    }
}
'''
line_prepend = "$indent"
times = 1